<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
  <defs>
    <!-- Define Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    
    <!-- Define Gradients -->
    <linearGradient id="presentation-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    
    <linearGradient id="service-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
    
    <linearGradient id="data-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff" />
      <stop offset="100%" stop-color="#f3e8ff" />
    </linearGradient>

    <!-- Marker for Arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
  </defs>

  <style>
    .title { font-family: 'Inter', system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #64748b; font-weight: 500; }
    .card-title { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; }
    .card-text { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #334155; }
    .card-item { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: #475569; }
    .connection-line { fill: none; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4 2; }
    .flow-line { fill: none; stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrow); }
  </style>

  <!-- Background -->
  <rect width="920" height="620" fill="#f8fafc" rx="16" />

  <!-- Presentation Layer (Column 1) -->
  <rect x="30" y="30" width="260" height="560" rx="12" fill="url(#presentation-grad)" stroke="#93c5fd" stroke-width="1.5" />
  <text x="160" y="60" text-anchor="middle" class="title" fill="#1e40af">Presentation Layer</text>
  <text x="160" y="78" text-anchor="middle" class="subtitle" fill="#2563eb">JavaFX GUI &amp; Navigation</text>

  <!-- UI Screens Card -->
  <g filter="url(#shadow)">
    <rect x="50" y="100" width="220" height="240" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="50" y="100" width="220" height="4" rx="2" fill="#3b82f6" />
    <text x="70" y="122" class="card-title" fill="#1e3a8a">UI Screens (GridPane)</text>
    <text x="70" y="142" class="card-item">• BaseScreen (Login Gateway)</text>
    <text x="70" y="160" class="card-item">• UserDashboard (Room Grid View)</text>
    <text x="70" y="178" class="card-item">• ConfirmRequestScreen</text>
    <text x="70" y="196" class="card-item">• UserHistory (Booking logs)</text>
    <text x="70" y="214" class="card-item">• UserRegisterScreen</text>
    <text x="70" y="232" class="card-item">• AdminDashboard (Control Hub)</text>
    <text x="70" y="250" class="card-item">• ActiveRequestsScreen</text>
    <text x="70" y="268" class="card-item">• AdminLoginScreen / Register</text>
    <text x="70" y="286" class="card-item">• EditRoomsScreen</text>
    <text x="70" y="304" class="card-item">• AddRoomScreen</text>
    <text x="70" y="322" class="card-item">• RemoveRoomScreen</text>
  </g>

  <!-- ScreenController Card -->
  <g filter="url(#shadow)">
    <rect x="50" y="440" width="220" height="100" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="50" y="440" width="220" height="4" rx="2" fill="#3b82f6" />
    <text x="70" y="465" class="card-title" fill="#1e3a8a">ScreenController</text>
    <text x="70" y="485" class="card-text">• Switch between screens</text>
    <text x="70" y="502" class="card-text">• Calls screen dispose()</text>
    <text x="70" y="519" class="card-text">• Manages Stage scenes</text>
  </g>

  <!-- Navigation Flow Line -->
  <path class="flow-line" d="M 150 340 L 150 432" />
  <path class="flow-line" d="M 170 440 L 170 348" />


  <!-- Service / Controller Layer (Column 2) -->
  <rect x="320" y="30" width="260" height="560" rx="12" fill="url(#service-grad)" stroke="#6ee7b7" stroke-width="1.5" />
  <text x="450" y="60" text-anchor="middle" class="title" fill="#065f46">Service Layer</text>
  <text x="450" y="78" text-anchor="middle" class="subtitle" fill="#059669">Business Logic &amp; Validators</text>

  <!-- AuthService Card -->
  <g filter="url(#shadow)">
    <rect x="340" y="100" width="220" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="340" y="100" width="220" height="4" rx="2" fill="#10b981" />
    <text x="360" y="122" class="card-title" fill="#064e3b">Auth Services</text>
    <text x="360" y="142" class="card-text">• AuthService (Authentication)</text>
    <text x="360" y="156" class="card-text">• User / Admin Registration</text>
  </g>

  <!-- RoomController Card -->
  <g filter="url(#shadow)">
    <rect x="340" y="185" width="220" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="340" y="185" width="220" height="4" rx="2" fill="#10b981" />
    <text x="360" y="207" class="card-title" fill="#064e3b">RoomController</text>
    <text x="360" y="227" class="card-text">• Availability algorithms</text>
    <text x="360" y="241" class="card-text">• Floor grid state management</text>
  </g>

  <!-- RequestRoomService Card -->
  <g filter="url(#shadow)">
    <rect x="340" y="270" width="220" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="340" y="270" width="220" height="4" rx="2" fill="#10b981" />
    <text x="360" y="292" class="card-title" fill="#064e3b">RequestRoomService</text>
    <text x="360" y="312" class="card-text">• Place booking requests</text>
    <text x="360" y="326" class="card-text">• Admin Approve/Reject logic</text>
  </g>

  <!-- History Services Card -->
  <g filter="url(#shadow)">
    <rect x="340" y="355" width="220" height="85" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="340" y="355" width="220" height="4" rx="2" fill="#10b981" />
    <text x="360" y="377" class="card-title" fill="#064e3b">History Services</text>
    <text x="360" y="397" class="card-text">• GetUserHistoryService</text>
    <text x="360" y="411" class="card-text">• GetRequestHistoryService</text>
    <text x="360" y="425" class="card-text">• Retrieve active/past logs</text>
  </g>

  <!-- Validators Card -->
  <g filter="url(#shadow)">
    <rect x="340" y="455" width="220" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="340" y="455" width="220" height="4" rx="2" fill="#10b981" />
    <text x="360" y="477" class="card-title" fill="#064e3b">Validators</text>
    <text x="360" y="497" class="card-text">• UserNameValidator</text>
    <text x="360" y="511" class="card-text">• AdminUserValidator</text>
  </g>


  <!-- Data & Model Layer (Column 3) -->
  <rect x="610" y="30" width="260" height="560" rx="12" fill="url(#data-grad)" stroke="#a78bfa" stroke-width="1.5" />
  <text x="740" y="60" text-anchor="middle" class="title" fill="#4c1d95">Data &amp; Model Layer</text>
  <text x="740" y="78" text-anchor="middle" class="subtitle" fill="#7c3aed">File Database &amp; Entities</text>

  <!-- Flat Files Card -->
  <g filter="url(#shadow)">
    <rect x="630" y="100" width="220" height="210" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="630" y="100" width="220" height="4" rx="2" fill="#8b5cf6" />
    <text x="650" y="125" class="card-title" fill="#4c1d95">Flat Files DB (src/db/)</text>
    <text x="650" y="148" class="card-text">Delimited text files:</text>
    <text x="650" y="172" class="card-item">• UserData (User details)</text>
    <text x="650" y="190" class="card-item">• AdminData (Admin credentials)</text>
    <text x="650" y="208" class="card-item">• RoomsData (Room specs)</text>
    <text x="650" y="226" class="card-item">• BookedRooms (Approved bookings)</text>
    <text x="650" y="244" class="card-item">• PendingRequests (Active queue)</text>
    
    <rect x="645" y="262" width="190" height="36" rx="4" fill="#f5f3ff" stroke="#ddd6fe" />
    <text x="652" y="276" font-family="Courier, monospace" font-size="9" fill="#6d28d9">Format: field1,field2||field3</text>
    <text x="652" y="289" font-family="Courier, monospace" font-size="9" fill="#6d28d9">Delimiters: "," and "||"</text>
  </g>

  <!-- Entities Card -->
  <g filter="url(#shadow)">
    <rect x="630" y="380" width="220" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="630" y="380" width="220" height="4" rx="2" fill="#8b5cf6" />
    <text x="650" y="405" class="card-title" fill="#4c1d95">Domain Entities</text>
    <text x="650" y="425" class="card-text">Plain Old Java Objects (POJOs):</text>
    <text x="650" y="450" class="card-item">• User (id, name, type, contact)</text>
    <text x="650" y="468" class="card-item">• Admin (id, name, username, pass)</text>
    <text x="650" y="486" class="card-item">• Room (number, floor, capacity)</text>
    <text x="650" y="504" class="card-item">• Booking (id, room, user, date, slot)</text>
  </g>


  <!-- CONNECTIONS -->

  <!-- ScreenController to Services Trunk -->
  <!-- Main outlet from ScreenController right edge (270, 490) -->
  <path class="flow-line" d="M 270 490 L 305 490 L 305 305 L 332 305" /> <!-- to RequestRoom -->
  <path class="flow-line" d="M 305 305 L 305 135 L 332 135" /> <!-- branch to Auth -->
  <path class="flow-line" d="M 305 305 L 305 220 L 332 220" /> <!-- branch to RoomController -->
  <path class="flow-line" d="M 305 305 L 305 390 L 332 390" /> <!-- branch to History -->
  <path class="flow-line" d="M 305 305 L 305 475 L 332 475" /> <!-- branch to Validators -->

  <!-- Services to Data Connections -->
  <!-- AuthService to User/Admin Data files -->
  <path class="flow-line" d="M 560 135 L 622 135" />
  
  <!-- RoomController to RoomsData file -->
  <path class="flow-line" d="M 560 220 L 622 220" />
  
  <!-- RequestRoomService to PendingRequests -->
  <path class="flow-line" d="M 560 305 L 590 305 L 590 270 L 622 270" />
  
  <!-- History Services to BookedRooms & PendingRequests -->
  <path class="flow-line" d="M 560 390 L 590 390 L 590 290 L 622 290" />

  <!-- Flat Files map to Domain Entities -->
  <path class="connection-line" d="M 740 310 L 740 372" />
  <polygon points="740,378 744,370 736,370" fill="#94a3b8" />
  <text x="745" y="350" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Parser Maps To</text>

</svg>
